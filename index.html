<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cessna Sixpack-Simulator</title>
<style>
:root{--bg:#15181b;--pan:#23272b;--ink:#e9e6dc;--mut:#9aa1a6;--amb:#f2a900}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif}
main{display:grid;grid-template-columns:minmax(0,640px) minmax(280px,1fr);gap:24px;max-width:1200px;margin:0 auto;padding:20px}
@media(max-width:900px){main{grid-template-columns:1fr}}
h1{font-size:20px;margin:0 0 12px}h2{font-size:15px;margin:0 0 10px}
.panel{background:linear-gradient(#2b3035,#1f2327);border:2px solid #0c0d0e;border-radius:10px;padding:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;box-shadow:inset 0 0 0 4px #181b1e}
.inst{text-align:center}.inst svg{width:100%;display:block;border-radius:50%;box-shadow:0 0 0 5px #050607,0 0 0 7px #3b4147}
.inst p{margin:10px 0 0;color:var(--mut);font-size:12px}
.inst.frz svg{box-shadow:0 0 0 5px #050607,0 0 0 8px var(--amb)}
.inst.off{visibility:hidden}
svg text{fill:#ece8dc;font-family:system-ui,sans-serif}
section{background:var(--pan);border-radius:8px;padding:14px;margin-bottom:14px}
.r{display:grid;grid-template-columns:125px 1fr 66px;align-items:center;gap:8px;margin:6px 0}
.r output{text-align:right;font-variant-numeric:tabular-nums;color:var(--amb)}
input[type=range]{width:100%;accent-color:var(--amb)}
button,select,input[type=number]{background:#15181b;color:var(--ink);border:1px solid #444b52;border-radius:6px;padding:7px 10px;font:inherit}
button:hover{border-color:var(--amb)}
:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:6px 0}
.row label{display:flex;gap:6px;align-items:center}
.ro{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.ro b{display:block;font-size:18px;color:var(--amb);font-variant-numeric:tabular-nums}.ro span{font-size:12px;color:var(--mut)}
small{color:var(--mut)}
input[type=number]{width:90px}
</style></head><body>
<main>
<div><h1>Cessna Sixpack-Simulator</h1><div class="panel" id="panel"></div></div>
<aside>
<section><h2>Panel</h2><div class="row">
<label><input type="radio" name="lay" value="six" checked>Sixpack</label>
<label><input type="radio" name="lay" value="t">Basic-T</label></div></section>
<section><h2>Flugzustand</h2>
<div class="row" id="pre"></div><div id="sl1"></div>
<div class="row"><label>Höhe (ft) <input type="number" id="n_alt" value="3500" min="0" max="20000" step="100"></label>
<label>Kurs (°) <input type="number" id="n_hdg" value="90" min="0" max="360" step="5"></label></div></section>
<section><h2>Tatsächliche Werte</h2><div class="ro">
<div><b id="r_ias">0</b><span>IAS kt</span></div><div><b id="r_alt">0</b><span>Höhe ft</span></div>
<div><b id="r_vs">0</b><span>VS ft/min</span></div><div><b id="r_hdg">0</b><span>Kurs °</span></div></div>
<small>Vergleiche die Anzeige der Instrumente mit diesen Werten, um Fehler zu erkennen.</small></section>
<section><h2>Fehler</h2>
<div class="row"><label>Staurohr <select id="pitot">
<option value="ok">in Ordnung</option>
<option value="ice">verstopft, Entwässerung zu (ASI wie Höhenmesser)</option>
<option value="drain">verstopft, Entwässerung offen (ASI fällt auf 0)</option></select></label></div>
<div class="row"><label><input type="checkbox" id="static">Statikquelle verstopft (ALT/VSI frieren, ASI falsch)</label></div>
<div class="row"><label><input type="checkbox" id="vac">Unterdruckpumpe fällt aus (AI und DG)</label></div>
<div class="row"><label><input type="checkbox" id="elec">Stromausfall (Wendezeiger)</label></div>
<div class="row"><label><input type="checkbox" id="voff">VSI-Nullpunktfehler (+300 ft/min)</label></div>
<div id="sl2"></div>
<div class="row"><span>Einfrieren:</span><span id="frz" class="row"></span></div>
<button id="reset">Alle Fehler zurücksetzen</button></section>
</aside></main>
<script>
const $=id=>document.getElementById(id),cl=(v,a,b)=>Math.min(b,Math.max(a,v));
const P=(r,a)=>[100+r*Math.sin(a*Math.PI/180),100-r*Math.cos(a*Math.PI/180)];
const ln=(a,r1,r2)=>{const[x,y]=P(r1,a),[u,v]=P(r2,a);return `<line x1="${x}" y1="${y}" x2="${u}" y2="${v}"/>`};
const tk=(A,r1,r2,w=2,c='#ece8dc')=>`<g stroke="${c}" stroke-width="${w}">${A.map(a=>ln(a,r1,r2)).join('')}</g>`;
const tx=(s,r,a,z=14)=>{const[x,y]=P(r,a);return `<text x="${x}" y="${y}" font-size="${z}" text-anchor="middle" dominant-baseline="central">${s}</text>`};
const arc=(r1,r2,a,b)=>{const[x1,y1]=P(r1,a),[x2,y2]=P(r1,b),[x3,y3]=P(r2,b),[x4,y4]=P(r2,a);return `M${x1} ${y1}A${r1} ${r1} 0 0 1 ${x2} ${y2}L${x3} ${y3}A${r2} ${r2} 0 0 0 ${x4} ${y4}Z`};
const rg=(a,b,s)=>{const o=[];for(let v=a;v<=b+1e-6;v+=s)o.push(v);return o};
const hand=(id,len,w)=>`<g id="${id}"><path d="M${100-w} 112L100 ${100-len}L${100+w} 112Z" fill="#fff"/></g><circle cx="100" cy="100" r="5" fill="#444"/>`;
const asiA=v=>20+v*1.6, vsA=v=>270+v/2000*165;

const I={};
I.asi=`<path d="${arc(90,86,asiA(33),asiA(85))}" fill="#fff"/><path d="${arc(83,78,asiA(44),asiA(129))}" fill="#3fb950"/><path d="${arc(83,78,asiA(129),asiA(163))}" fill="#f2c200"/>`
+tk(rg(0,200,10).map(asiA),90,85,1.5)+tk(rg(0,200,20).map(asiA),90,80,2)+tk([asiA(163)],92,74,3,'#e5484d')
+rg(20,200,20).map(v=>tx(v,64,asiA(v),12)).join('')+tx('KIAS',100,180,10)+hand('h_asi',84,3);
I.alt=tk(rg(0,352.8,7.2),90,85,1)+tk(rg(0,324,36),90,78,3)+rg(0,9,1).map(n=>tx(n,66,n*36,16)).join('')
+`<rect x="116" y="92" width="46" height="16" fill="#000" stroke="#888"/><text id="kol" x="139" y="100" font-size="11" text-anchor="middle" dominant-baseline="central">1013</text>`
+hand('h_a1k',52,4.5)+hand('h_a100',84,2.2);
let lad='',lt='';for(const p of[-20,-15,-10,-5,5,10,15,20]){const y=100-p*2.2,h=p%10?11:22;lad+=`<line x1="${100-h}" x2="${100+h}" y1="${y}" y2="${y}"/>`;if(!(p%10))lt+=`<text x="${100+h+8}" y="${y}" font-size="9" dominant-baseline="central">${Math.abs(p)}</text>`}
I.ai=`<clipPath id="cp"><circle cx="100" cy="100" r="92"/></clipPath><g clip-path="url(#cp)"><g id="h_air"><g id="h_aip"><rect x="-300" y="-500" width="800" height="600" fill="#3a78c2"/><rect x="-300" y="100" width="800" height="600" fill="#8b5a2b"/><line x1="-300" x2="500" y1="100" y2="100" stroke="#fff" stroke-width="2"/><g stroke="#fff" stroke-width="1.5">${lad}</g>${lt}</g><path d="M100 22L94 34H106Z" fill="#f2a900"/></g></g>`
+tk([-60,-45,-30,-20,-10,10,20,30,45,60],92,84,2)+tk([0],92,80,3)
+`<path d="M38 100H78L88 112M162 100H122L112 112" stroke="#f2a900" stroke-width="5" fill="none" stroke-linejoin="round"/><circle cx="100" cy="100" r="4" fill="#f2a900"/>`;
I.tc=tk([90,110,250,270],90,78,3)+tx('L',62,248)+tx('R',62,112)+`<text x="100" y="58" font-size="10" text-anchor="middle">2 MIN</text>`
+`<path d="M52 150Q100 170 148 150" stroke="#555" stroke-width="14" fill="none" stroke-linecap="round"/><g stroke="#000" stroke-width="2"><line x1="90" y1="151" x2="90" y2="168"/><line x1="110" y1="151" x2="110" y2="168"/></g><circle id="ball" r="6" fill="#eee"/>`
+`<g id="h_tc"><path d="M32 100H168M100 100V70" stroke="#fff" stroke-width="6" fill="none"/><circle cx="100" cy="100" r="7" fill="#fff"/></g>`
+`<g id="tcflag" visibility="hidden"><rect x="70" y="36" width="60" height="22" fill="#e5484d"/><text x="100" y="47" font-size="14" text-anchor="middle" dominant-baseline="central">OFF</text></g>`;
let dgl='',dgt='';for(let a=0;a<360;a+=5){const L=a%30?a%10?5:9:14;dgl+=ln(a,92,92-L)}
for(let a=0;a<360;a+=30){const t={0:'N',90:'E',180:'S',270:'W'}[a]??a/10,[x,y]=P(66,a);dgt+=`<text transform="rotate(${a} ${x} ${y})" x="${x}" y="${y}" font-size="${a%90?14:18}" text-anchor="middle" dominant-baseline="central">${t}</text>`}
I.dg=`<g id="h_dg"><g stroke="#ece8dc" stroke-width="1.5">${dgl}</g>${dgt}</g><path d="M100 72V132M72 104H128M90 130H110" stroke="#f2a900" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M100 6L94 20H106Z" fill="#f2a900"/>`;
const vv=[0,500,1000,1500,2000,-500,-1000,-1500,-2000];
I.vsi=tk(rg(-2000,2000,100).map(vsA),90,86,1)+tk(vv.map(vsA),90,80,2.5)+vv.map(v=>tx(v?Math.abs(v)/1000:0,66,vsA(v),12)).join('')
+`<text x="100" y="74" font-size="9" text-anchor="middle">UP</text><text x="100" y="134" font-size="9" text-anchor="middle">DN</text><text x="100" y="150" font-size="8" text-anchor="middle">1000 FT/MIN</text>`+hand('h_vsi',78,2);
const INS=[['asi','Fahrtmesser'],['ai','Künstlicher Horizont'],['alt','Höhenmesser'],['tc','Wendezeiger'],['dg','Kurskreisel'],['vsi','Variometer']];
$('panel').innerHTML=INS.map(([k,n])=>`<div class="inst" id="w_${k}"><svg viewBox="0 0 200 200" role="img" aria-label="${n}"><circle cx="100" cy="100" r="98" fill="#0b0c0d"/>${I[k]}</svg><p>${n}</p></div>`).join('');
$('frz').innerHTML=INS.map(([k,n])=>`<label><input type="checkbox" data-f="${k}">${k.toUpperCase()}</label>`).join('');

/* Regler */
const SL=[['pitch','Nicklage',-30,30,1,2,'°'],['bank','Querneigung',-70,70,1,0,'°'],['ias','Fahrt (IAS)',30,180,1,100,'kt'],['slip','Kugel (Schieben)',-1,1,.05,0,''],['turb','Turbulenz',0,1,.05,0,''],
['qset','QNH eingestellt',950,1050,1,1013,'hPa'],['qtrue','QNH tatsächlich',950,1050,1,1013,'hPa'],['drift','DG-Drift',-10,10,1,0,'°/min']];
const T={};
const row=([id,l,a,b,s,v,u])=>{T[id]=v;return `<div class="r"><label for="s_${id}">${l}</label><input type="range" id="s_${id}" min="${a}" max="${b}" step="${s}" value="${v}"><output id="o_${id}">${v} ${u}</output></div>`};
$('sl1').innerHTML=SL.slice(0,5).map(row).join('');$('sl2').innerHTML=SL.slice(5).map(row).join('');
SL.forEach(([id,,,,,,u])=>$('s_'+id).addEventListener('input',e=>{T[id]=+e.target.value;$('o_'+id).textContent=e.target.value+' '+u}));
const set=(id,v)=>{$('s_'+id).value=v;$('s_'+id).dispatchEvent(new Event('input'))};
const PRE={Reiseflug:[2,0,100],Steigflug:[10,0,75],Anflug:[2,0,70],Standardkurve:[2,15,100],Steilkurve:[1,45,110],Spiralsturz:[-15,50,150]};
$('pre').innerHTML=Object.keys(PRE).map(k=>`<button data-p="${k}">${k}</button>`).join('');
$('pre').onclick=e=>{const p=PRE[e.target.dataset.p];if(p){set('pitch',p[0]);set('bank',p[1]);set('ias',p[2]);set('slip',0)}};
document.querySelectorAll('[name=lay]').forEach(r=>r.onchange=()=>['tc','vsi'].forEach(k=>$('w_'+k).classList.toggle('off',r.value=='t'&&r.checked)));

/* Zustand und Fehler */
const st={pitch:2,bank:0,ias:100,slip:0,alt:3500,hdg:90,vsiS:0,tcS:0};
const F={pitot:'ok',static:false,vac:false,elec:false,voff:false,frz:{},i0:100,a0:0,dec:100,sa:0,vsd:0,vt:0,err:0,tcD:0};
$('n_alt').onchange=e=>st.alt=cl(+e.target.value,0,20000);
$('n_hdg').onchange=e=>st.hdg=(+e.target.value%360+360)%360;
$('pitot').onchange=e=>{F.pitot=e.target.value;F.i0=F.dec=st.ias;F.a0=st.alt};
$('static').onchange=e=>{F.static=e.target.checked;F.sa=st.alt;F.vsd=st.vsiS};
$('vac').onchange=e=>{F.vac=e.target.checked;F.vt=0};
$('elec').onchange=e=>{F.elec=e.target.checked;F.tcD=st.tcS};
$('voff').onchange=e=>F.voff=e.target.checked;
document.querySelectorAll('[data-f]').forEach(c=>c.onchange=()=>{F.frz[c.dataset.f]=c.checked;$('w_'+c.dataset.f).classList.toggle('frz',c.checked)});
$('reset').onclick=()=>{Object.assign(F,{pitot:'ok',static:false,vac:false,elec:false,voff:false,frz:{},err:0,vt:0});
$('pitot').value='ok';document.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=false);document.querySelectorAll('.inst').forEach(w=>w.classList.remove('frz'));set('drift',0);set('qset',1013);set('qtrue',1013)};

/* Simulation */
const rot=(id,a)=>$(id).setAttribute('transform',`rotate(${a} 100 100)`);
const D={};let last=performance.now(),t=0;
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
 const k=tau=>1-Math.exp(-dt/tau);
 st.pitch+=(T.pitch-st.pitch)*k(.6);st.bank+=(T.bank-st.bank)*k(.8);st.ias+=(T.ias-st.ias)*k(2.5);st.slip+=(T.slip-st.slip)*k(.4);
 const rad=Math.PI/180,alpha=cl(2+(100-st.ias)*.12,0,18),tas=st.ias*(1+st.alt/50000);
 const vs=tas*101.27*Math.sin((st.pitch-alpha)*rad),rate=tas>20?1091*Math.tan(st.bank*rad)/tas:0;
 st.hdg=(st.hdg+rate*dt+360)%360;st.alt=Math.max(0,st.alt+vs/60*dt);
 st.vsiS+=(vs-st.vsiS)*k(5);st.tcS+=(rate-st.tcS)*k(.3);
 const nz=s=>(Math.sin(t*1.7+s)+Math.sin(t*3.1+s*2)+Math.sin(t*5.3+s*3))/3,tb=T.turb;
 let a=st.ias;
 if(F.pitot=='ice')a=F.i0+(st.alt-F.a0)*.03;
 else if(F.pitot=='drain'){F.dec*=Math.exp(-dt/15);a=F.dec}
 if(F.static)a-=(st.alt-F.sa)*.02;
 if(F.vac)F.vt+=dt;
 const w=F.vac?Math.max(0,1-F.vt/60):1;
 F.err+=((1-w)*.6+T.drift/60)*dt;
 const R={
  asi:Math.max(0,a)+tb*6*nz(1),
  ai:[st.pitch+(1-w)*25*Math.sin(t*.31)+tb*3*nz(2),st.bank+(1-w)*45*Math.sin(t*.23+1)+tb*6*nz(3)],
  alt:(F.static?F.sa:st.alt)+(T.qset-T.qtrue)*27,
  tc:[F.elec?(F.tcD*=Math.exp(-dt/4)):st.tcS,st.slip],
  dg:(st.hdg+F.err+720)%360,
  vsi:(F.static?(F.vsd*=Math.exp(-dt/3)):st.vsiS)+(F.voff?300:0)+tb*300*nz(4)};
 for(const key in R)if(!F.frz[key])D[key]=R[key];
 rot('h_asi',asiA(cl(D.asi,0,200)));
 rot('h_a100',(D.alt%1000+1000)%1000*.36);rot('h_a1k',(D.alt%10000+10000)%10000*.036);
 $('kol').textContent=Math.round(T.qset);
 $('h_air').setAttribute('transform',`rotate(${-D.ai[1]} 100 100)`);
 $('h_aip').setAttribute('transform',`translate(0 ${D.ai[0]*2.2})`);
 rot('h_tc',cl(D.tc[0]*6.67,-40,40));
 const bt=.5+cl(D.tc[1],-1,1)*.4;$('ball').setAttribute('cx',52+96*bt);$('ball').setAttribute('cy',150+40*bt*(1-bt));
 $('tcflag').setAttribute('visibility',F.elec?'visible':'hidden');
 rot('h_dg',-D.dg);rot('h_vsi',vsA(cl(D.vsi,-2000,2000)));
 $('r_ias').textContent=Math.round(st.ias);$('r_alt').textContent=Math.round(st.alt);
 $('r_vs').textContent=Math.round(vs);$('r_hdg').textContent=Math.round(st.hdg);
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
